name: 안드로이드 앱 빌드

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: 서명키 준비
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::ANDROID_KEYSTORE_B64 secret이 없습니다"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: APK 빌드
        working-directory: android
        run: |
          set -o pipefail
          if ! gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log; then
            # 로그를 못 보는 경우를 위해 핵심 오류를 주석(annotation)으로 남긴다
            msg=$( { sed -n '/What went wrong/,/^\* Try/p' build.log; grep -E "error:|ERROR:|AAPT|Lint found" build.log; } | grep -v "^> Task" | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=빌드 실패::${msg}"
            exit 1
          fi
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: cp android/app/build/outputs/apk/release/app-release.apk sagyu.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: 사규검색 앱 ${{ github.run_number }}
          body: 안드로이드용 사규검색 앱입니다. sagyu.apk 를 받아 설치하세요.
          files: sagyu.apk
          make_latest: true
